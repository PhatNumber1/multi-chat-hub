<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Multi Chat Hub</title>
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' file:; style-src 'self' file:; img-src https://static-cdn.jtvnw.net; connect-src ws://127.0.0.1:* https://id.twitch.tv https://api.twitch.tv wss://eventsub.wss.twitch.tv; base-uri 'none'; form-action 'none'">
<link rel="stylesheet" href="css/dock.css">
</head>
<body>
<header id="top">
  <div id="accounts"></div>
  <div id="total" title="Combined viewers"></div>
  <button id="find" class="icon" title="Search chat (Ctrl+F)" aria-label="Search chat"><svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="6.5" cy="6.5" r="4.5"/><path d="m10 10 4.5 4.5"/></svg></button>
  <button id="mod" class="icon" title="Moderator page" aria-label="Moderator page"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 1.5 13.5 3.500v4.200c0 3.200-2.200 5.700-5.500 6.800-3.300-1.100-5.500-3.600-5.500-6.800V3.500z"/></svg></button>
  <button id="hide" class="icon" title="Clean mode: show only chat" aria-label="Clean mode">&#9723;</button>
  <button id="gear" class="icon" title="Settings" aria-label="Settings">&#9881;</button>
</header>
<section id="live" aria-label="Go Live"></section>
<section id="outputs" hidden aria-label="All outputs"></section>
<section id="search" hidden aria-label="Search chat">
  <div class="sRow">
    <input id="sText" type="text" placeholder="Word, &quot;exact phrase&quot; or from:name" aria-label="Search chat" spellcheck="false">
    <button id="sUp" type="button" title="Older match" aria-label="Older match">&#9650;</button>
    <button id="sDown" type="button" title="Newer match" aria-label="Newer match">&#9660;</button>
    <button id="sClose" type="button" title="Close search" aria-label="Close search">&#10005;</button>
  </div>
  <div class="sRow">
    <select id="sPlatform" aria-label="Platform"></select>
    <select id="sAccount" aria-label="Account"></select>
    <span id="sCount" role="status"></span>
  </div>
</section>
<div id="results" class="chatLook" hidden aria-label="Search results"></div>
<main id="chatWrap">
  <div id="chat" class="chatLook" role="log" aria-label="Chat"></div>
  <button id="corner" title="Show everything" aria-label="Show everything">&#9724;</button>
  <button id="jump" hidden>Jump to latest</button>
</main>
<section id="modPage" hidden aria-label="Moderator"></section>
<section id="panel" hidden aria-label="Settings"></section>
<div id="menu" role="menu" hidden></div>
<div id="toast" role="status" hidden></div>
<dialog id="dialog"></dialog>
<script src="js/config.js"></script>
<script src="js/util.js"></script>
<script src="js/look.js"></script>
<script src="js/search.js"></script>
<script src="js/store.js"></script>
<script src="js/twitch.js"></script>
<script src="js/demo.js"></script>
<script src="js/obs.js"></script>
<script src="js/app.js"></script>
<script src="js/live.js"></script>
<script src="js/mod.js"></script>
</body>
</html>
