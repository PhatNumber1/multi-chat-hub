<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Multi Chat Hub</title>
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' file:; style-src 'self' file:; img-src https://static-cdn.jtvnw.net https://files.kick.com; connect-src ws://127.0.0.1:* https://id.twitch.tv https://api.twitch.tv wss://eventsub.wss.twitch.tv https://kick.com wss://ws-us2.pusher.com https://www.googleapis.com wss://ws.eulerstream.com; base-uri 'none'; form-action 'none'">
<link rel="stylesheet" href="css/dock.css">
</head>
<body>
<header id="top">
  <div class="bar">
    <div>
      <button id="find" class="icon" title="Search chat (Ctrl+F)" aria-label="Search chat"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M10.5 3.5a7 7 0 1 0 0 14 7 7 0 0 0 0-14zM15.7 15.7 21 21"/></svg></button>
      <button id="mod" class="icon" title="Moderator page" aria-label="Moderator page"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2.5 20 5.5v6c0 4.7-3.2 8.3-8 10-4.8-1.7-8-5.3-8-10v-6z"/></svg></button>
    </div>
    <span id="status" role="status"></span>
    <div>
      <span id="demoTag" hidden>Demo</span>
      <button id="help" class="icon" title="Help and setup" aria-label="Help"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3a9 9 0 1 0 0 18 9 9 0 0 0 0-18zM9.3 9.4a2.8 2.8 0 1 1 4.1 2.4c-.9.5-1.4 1.1-1.4 2.1M12 17v.1"/></svg></button>
      <button id="hide" class="icon" title="Clean mode: show only chat" aria-label="Clean mode"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 3.5H3.5V9M15 3.5h5.5V9M9 20.5H3.5V15M15 20.5h5.5V15"/></svg></button>
      <button id="gear" class="icon" title="Settings" aria-label="Settings"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 8.8a3.2 3.2 0 1 0 0 6.4 3.2 3.2 0 0 0 0-6.4zM12 5.4a6.6 6.6 0 1 0 0 13.2 6.6 6.6 0 0 0 0-13.2zM12 2.5v3M12 18.5v3M2.5 12h3M18.5 12h3M5.3 5.3l2.1 2.1M16.6 16.6l2.1 2.1M5.3 18.7l2.1-2.1M16.6 7.4l2.1-2.1"/></svg></button>
    </div>
  </div>
  <div id="stats">
    <div id="total" class="stat" title="Total viewers"></div>
    <div id="accounts"></div>
  </div>
</header>
<div id="alert" role="alert" hidden></div>
<section id="live" aria-label="Go Live"></section>
<section id="outputs" hidden aria-label="All outputs"></section>
<section id="search" hidden aria-label="Search chat">
  <div class="sRow">
    <input id="sText" type="text" placeholder="Word, &quot;exact phrase&quot; or from:name" aria-label="Search chat" spellcheck="false">
    <button id="sUp" type="button" title="Older match" aria-label="Older match"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 15l7-7 7 7"/></svg></button>
    <button id="sDown" type="button" title="Newer match" aria-label="Newer match"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 9l7 7 7-7"/></svg></button>
    <button id="sClose" type="button" title="Close search" aria-label="Close search"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
  </div>
  <div class="sRow">
    <select id="sPlatform" aria-label="Platform"></select>
    <select id="sAccount" aria-label="Account"></select>
    <span id="sCount" role="status"></span>
  </div>
</section>
<div id="results" class="chatLook" hidden aria-label="Search results"></div>
<main id="chatWrap">
  <div id="chat" class="chatLook" role="log" aria-label="Chat"></div>
  <button id="corner" title="Show everything" aria-label="Show everything"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 3.5H3.5V9M15 3.5h5.5V9M9 20.5H3.5V15M15 20.5h5.5V15"/></svg></button>
  <button id="jump" hidden>Jump to latest</button>
</main>
<section id="modPage" hidden aria-label="Moderator"></section>
<section id="panel" hidden aria-label="Settings"></section>
<div id="menu" role="menu" hidden></div>
<div id="toast" role="status" hidden></div>
<dialog id="dialog"></dialog>
<script src="js/config.js"></script>
<script src="js/util.js"></script>
<script src="js/look.js"></script>
<script src="js/search.js"></script>
<script src="js/store.js"></script>
<script src="js/twitch.js"></script>
<script src="js/platforms.js"></script>
<script src="js/demo.js"></script>
<script src="js/obs.js"></script>
<script src="js/app.js"></script>
<script src="js/accounts.js"></script>
<script src="js/live.js"></script>
<script src="js/mod.js"></script>
<script src="js/conn.js"></script>
<script src="js/bot.js"></script>
<script src="js/help.js"></script>
</body>
</html>
